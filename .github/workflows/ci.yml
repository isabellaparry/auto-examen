name: CI - Examen Final

on:
  push:
    branches:
      - main
      - feature/pruebas

  pull_request:
    branches:
      - main

jobs:

  build:

    name: Build
    runs-on: ubuntu-latest

    steps:

      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Compilar proyecto
        run: mvn clean compile


  unit-tests:

    name: Unit Tests
    runs-on: ubuntu-latest
    needs: build

    steps:

      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Ejecutar pruebas unitarias
        run: mvn test


  integration-tests:

    name: Integration Tests
    runs-on: ubuntu-latest
    needs: unit-tests

    steps:

      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Ejecutar pruebas de integracion
        run: mvn verify